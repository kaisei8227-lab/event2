<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ログイン')}"></head>
<body class="center-page">

<main class="card auth-card">
    <h1 id="login-title">ログイン</h1>

    <p th:if="${param.logout}" class="flash flash-ok">ログアウトしました</p>
    <p th:if="${loginError}" class="flash flash-error" th:text="${loginError}"></p>

    <form th:action="@{/login}" th:object="${loginForm}" method="post" id="login-form" novalidate>

        <!-- 学生／企業の切り替え（ラジオボタンをタブの見た目にしている）-->
        <div class="role-switch" role="radiogroup" aria-label="ログインの種類">
            <label class="role-option">
                <input type="radio" th:field="*{role}" value="USER">
                <span>学生の方</span>
            </label>
            <label class="role-option">
                <input type="radio" th:field="*{role}" value="COMPANY">
                <span>企業の方</span>
            </label>
        </div>

        <div class="field">
            <label for="email">メールアドレス</label>
            <input type="email" th:field="*{email}" autocomplete="email"
                   placeholder="name@example.com" required>
            <p class="field-msg" id="email-msg"></p>
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="field">
            <label for="password">パスワード</label>
            <!-- パスワードは入力し直しになるよう th:field を使わない -->
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <p class="field-msg" id="password-msg"></p>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <!-- メールアドレスとパスワードの形が両方正しいときだけ押せる（login.js）-->
        <button type="submit" id="login-btn" class="btn btn-block" disabled>ログイン</button>
    </form>

    <p class="auth-switch">
        会員登録がまだの方は<br>
        <a th:href="@{/register}" id="register-link" class="btn-link">新規会員登録はこちら</a>
    </p>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
