spring.application.name=event-reserve

# Render は PORT という環境変数で番号を渡してくる。ローカルでは 8080
server.port=${PORT:8080}
server.servlet.session.timeout=30m
# Render はHTTPSを受けてからアプリへ転送するので、元のURL（https://...）をアプリが正しく知るための設定
server.forward-headers-strategy=framework

# ---------- データベース（ローカル）----------
# ホームフォルダの event-reservation-data フォルダに保存される（再起動しても会員情報が残る）
# プロジェクトの場所に関係なく同じファイルを使うので、新しいzipを別の場所に解凍しても会員情報は消えない
#   Windows: C:\Users\<ユーザー名>\event-reservation-data
#   Mac:     /Users/<ユーザー名>/event-reservation-data
spring.datasource.url=jdbc:h2:file:~/event-reservation-data/eventdb
spring.datasource.username=sa
spring.datasource.password=

# テーブルはエンティティから自動で作る／更新する
spring.jpa.hibernate.ddl-auto=update
# 画面の表示中もDBから関連データを読めるようにする（学習用の簡単な設定）
spring.jpa.open-in-view=true

# テンプレートを変更したらすぐ反映
spring.thymeleaf.cache=false
