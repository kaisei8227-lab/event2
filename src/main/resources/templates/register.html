<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('新規会員登録')}"></head>
<body class="center-page">

<main class="card auth-card">
    <h1 id="register-title">新規会員登録</h1>

    <form th:action="@{/register}" th:object="${registerForm}" method="post" id="register-form" novalidate>

        <!-- 学生／企業を選ぶ -->
        <div class="role-switch" role="radiogroup" aria-label="登録の種類">
            <label class="role-option">
                <input type="radio" th:field="*{role}" value="USER">
                <span>学生として登録</span>
            </label>
            <label class="role-option">
                <input type="radio" th:field="*{role}" value="COMPANY">
                <span>企業として登録</span>
            </label>
        </div>

        <!-- 企業を選んだときだけ表示（register.js）-->
        <div class="field" id="company-field">
            <label for="companyName">企業名 <span class="req">必須</span></label>
            <input type="text" th:field="*{companyName}" autocomplete="organization" placeholder="〇〇株式会社">
            <p class="field-hint">イベント掲示板に表示されます</p>
            <p class="field-error" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></p>
        </div>

        <div class="field">
            <label for="email">メールアドレス</label>
            <input type="email" th:field="*{email}" autocomplete="email" required>
            <p class="field-msg" id="email-msg"></p>
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="field">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required>
            <p class="field-hint">英字と数字をふくむ8文字以上</p>
            <p class="field-msg" id="password-msg"></p>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="field">
            <label for="passwordConfirm">パスワード（確認）</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password" required>
            <p class="field-msg" id="confirm-msg"></p>
            <p class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
        </div>

        <button type="submit" id="register-btn" class="btn btn-block" disabled>登録する</button>
    </form>

    <p class="auth-switch">
        <a th:href="@{/login}" class="btn-link">ログイン画面に戻る</a>
    </p>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/register.js}"></script>
</body>
</html>
