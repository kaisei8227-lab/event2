# Render（本番）用。環境変数 SPRING_PROFILES_ACTIVE=prod のときに読み込まれる。
#
# DBの接続先は Render の Environment に次の3つを設定する（ここには書かない）
#   SPRING_DATASOURCE_URL      = jdbc:postgresql://ホスト名:5432/DB名
#   SPRING_DATASOURCE_USERNAME = ユーザー名
#   SPRING_DATASOURCE_PASSWORD = パスワード
#
# SPRING_DATASOURCE_URL を設定し忘れると起動に失敗するようにしてある。
# （設定しないとコンテナ内のH2ファイルに保存され、再起動のたびに会員情報が消えてしまうため）
spring.datasource.url=${SPRING_DATASOURCE_URL}

spring.thymeleaf.cache=true
