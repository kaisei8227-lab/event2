<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('イベントの編集')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container narrow">
    <p><a th:href="@{/admin/events}">← イベント管理に戻る</a></p>
    <h1>イベントの編集</h1>

    <form th:action="@{/admin/events/{id}/edit(id=${event.id})}" th:object="${eventForm}" method="post"
          id="event-form" class="card" novalidate>

        <th:block th:replace="~{admin/event-fields :: fields}"></th:block>

        <p class="field-hint">
            参加人数を増やすと、増えた分だけキャンセル待ちの人が申し込み順に自動で予約確定になります。
            予約確定の人数より少なくはできません。
        </p>

        <div class="actions">
            <a th:href="@{/admin/events}" class="btn-outline">キャンセル</a>
            <button type="submit" id="event-btn" class="btn">変更を保存する</button>
        </div>
    </form>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
